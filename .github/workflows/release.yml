name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Configure required Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $hasPfx = $env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD
          $artifactValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $hasArtifactSigning = ($artifactValues | Where-Object { -not $_ }).Count -eq 0

          if ($hasArtifactSigning) {
            if ($env:ARTIFACT_SIGNING_ENDPOINT -notmatch '^https://[a-z0-9.-]+/?$') {
              throw 'ARTIFACT_SIGNING_ENDPOINT must be an HTTPS Artifact Signing endpoint'
            }
            if ($env:ARTIFACT_SIGNING_ACCOUNT -notmatch '^[A-Za-z0-9_-]+$' -or
                $env:ARTIFACT_SIGNING_PROFILE -notmatch '^[A-Za-z0-9_-]+$') {
              throw 'Artifact Signing account and profile names contain unsupported characters'
            }
            cargo install artifact-signing-cli --version 0.11.0 --locked
            $signCommand = "artifact-signing-cli -e $env:ARTIFACT_SIGNING_ENDPOINT -a $env:ARTIFACT_SIGNING_ACCOUNT -c $env:ARTIFACT_SIGNING_PROFILE -d Dictum %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $signCommand } } } | ConvertTo-Json -Depth 4
            Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Value $config
            'mode=Azure Artifact Signing' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($hasPfx) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'dictum-certificate.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $certificate = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password) |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) { throw 'Windows code-signing certificate import failed or contains no private key' }
            if ($certificate.NotAfter -le (Get-Date)) { throw 'Windows code-signing certificate has expired' }
            if ($certificate.PublicKey.Oid.Value -ne '1.2.840.113549.1.1.1') {
              throw 'Smart App Control requires an RSA code-signing certificate; ECC is unsupported'
            }
            $codeSigningOid = '1.3.6.1.5.5.7.3.3'
            $hasCodeSigningEku = $certificate.Extensions.EnhancedKeyUsages.Value -contains $codeSigningOid
            if (-not $hasCodeSigningEku) { throw 'Certificate is not valid for code signing' }
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4
            Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Value $config
            'mode=Authenticode PFX' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            throw @'
          Refusing to publish unsigned Windows binaries.
          Configure either Azure Artifact Signing (AZURE_* secrets plus ARTIFACT_SIGNING_* variables)
          or the WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets.
          See docs/releasing.md.
          '@
          }
          'config_args=--config src-tauri/tauri.windows-signing.conf.json' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release signing mode: $((Get-Content $env:GITHUB_OUTPUT | Select-String '^mode=').Line.Substring(5))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Dictum v__VERSION__ for Windows
          releaseBody: Download the NSIS installer or MSI package below.
          releaseDraft: true
          prerelease: false
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}' ${{ steps.signing.outputs.config_args }}
      - name: Verify every distributed Windows signature
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri\target\release\bundle -Recurse -File | Where-Object {
            $_.Name -like "Dictum_$version*" -and $_.Extension -in @('.exe', '.msi')
          })
          if ($installers.Count -ne 2) { throw "Expected one NSIS and one MSI artifact, found $($installers.Count)" }
          $files = @((Get-Item src-tauri\target\release\dictum.exe)) + $installers
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Missing trusted timestamp on $($file.Name)"
            }
            Write-Host "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $artifacts = Get-ChildItem src-tauri\target\release\bundle -Recurse -File | Where-Object {
            $_.Name -like "Dictum_$version*" -and $_.Extension -in @('.exe', '.msi')
          }
          if ($artifacts.Count -ne 2) { throw "Expected one NSIS and one MSI artifact, found $($artifacts.Count)" }
          $checksums = $artifacts | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $checksums
          gh release upload "v$version" SHA256SUMS.txt --clobber
