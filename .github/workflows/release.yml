name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-native
      - run: npm ci
      - name: Check release version and protect published packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }
          $existing = gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) {
            throw "v$version is already public. Bump the version instead of replacing published packages."
          }
      - name: Check updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required. Keep the existing key so installed versions can verify updates.'
          }
      - name: Configure Windows publisher signing when available
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasPfx = $env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD
          $artifactValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $hasArtifactSigning = ($artifactValues | Where-Object { -not $_ }).Count -eq 0
          $hasPartialSigning = $env:WINDOWS_CERTIFICATE -or $env:WINDOWS_CERTIFICATE_PASSWORD -or
            ($artifactValues | Where-Object { $_ }).Count -gt 0

          if ($hasArtifactSigning) {
            if ($env:ARTIFACT_SIGNING_ENDPOINT -notmatch '^https://[a-z0-9.-]+/?$') {
              throw 'ARTIFACT_SIGNING_ENDPOINT must be an HTTPS Artifact Signing endpoint'
            }
            if ($env:ARTIFACT_SIGNING_ACCOUNT -notmatch '^[A-Za-z0-9_-]+$' -or
                $env:ARTIFACT_SIGNING_PROFILE -notmatch '^[A-Za-z0-9_-]+$') {
              throw 'Artifact Signing account and profile names contain unsupported characters'
            }
            cargo install artifact-signing-cli --version 0.11.0 --locked
            if ($LASTEXITCODE -ne 0) { throw 'Artifact signing tool installation failed' }
            $signCommand = "artifact-signing-cli -e $env:ARTIFACT_SIGNING_ENDPOINT -a $env:ARTIFACT_SIGNING_ACCOUNT -c $env:ARTIFACT_SIGNING_PROFILE -d Dictum %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $signCommand } } } | ConvertTo-Json -Depth 4
            Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Value $config
            'mode=Azure Artifact Signing' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($hasPfx) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'dictum-certificate.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $certificate = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password) |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) { throw 'Windows code-signing certificate import failed or contains no private key' }
            if ($certificate.NotAfter -le (Get-Date)) { throw 'Windows code-signing certificate has expired' }
            if ($certificate.PublicKey.Oid.Value -ne '1.2.840.113549.1.1.1') {
              throw 'Smart App Control requires an RSA code-signing certificate; ECC is unsupported'
            }
            $codeSigningOid = '1.3.6.1.5.5.7.3.3'
            $hasCodeSigningEku = $certificate.Extensions.EnhancedKeyUsages.Value -contains $codeSigningOid
            if (-not $hasCodeSigningEku) { throw 'Certificate is not valid for code signing' }
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4
            Set-Content -Path src-tauri/tauri.windows-signing.conf.json -Value $config
            'mode=Authenticode PFX' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($hasPartialSigning) {
            throw 'Windows signing credentials are incomplete. Complete or remove the unused signing configuration; do not silently downgrade a configured signer.'
          } else {
            'mode=unsigned' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            'config_args=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            'notice=Windows installers do not have an Authenticode publisher signature. Windows may warn or block installation. Automatic updates remain protected by the existing Tauri signing key.' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            '## Windows publisher signing: unsigned' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            'No Windows certificate is configured. The release is built without Authenticode; Tauri updater signatures remain required.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          'config_args=--config src-tauri/tauri.windows-signing.conf.json' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          'notice=Windows installers have a timestamped Authenticode publisher signature. Automatic updates are also protected by the Tauri signing key.' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release signing mode: $((Get-Content $env:GITHUB_OUTPUT | Select-String '^mode=').Line.Substring(5))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Dictum v__VERSION__ for Windows
          releaseBody: |
            Download the NSIS installer (.exe, recommended) or MSI package below. Model weights are downloaded separately inside Dictum.

            ${{ steps.signing.outputs.notice }}

            See the [local model guide](https://github.com/Vkandil/dictum/blob/main/docs/local-models.md), [privacy policy](https://github.com/Vkandil/dictum/blob/main/PRIVACY.md), and [code signing policy](https://github.com/Vkandil/dictum/blob/main/docs/code-signing-policy.md).
          releaseDraft: true
          prerelease: false
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}' ${{ steps.signing.outputs.config_args }}
      - name: Verify Windows packages and declared signing mode
        shell: pwsh
        env:
          WINDOWS_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri\target\release\bundle -Recurse -File | Where-Object {
            $_.Name -like "Dictum_$version*" -and $_.Extension -in @('.exe', '.msi')
          })
          if ($installers.Count -ne 2) { throw "Expected one NSIS and one MSI artifact, found $($installers.Count)" }
          $files = @(
            (Get-Item src-tauri\target\release\dictum.exe),
            (Get-Item src-tauri\target\release\dictum-cli.exe)
          ) + $installers
          foreach ($name in @('onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll')) {
            if (-not (Test-Path "src-tauri\native-runtime\$name")) { throw "Missing native speech runtime: $name" }
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($env:WINDOWS_SIGNING_MODE -eq 'unsigned') {
              if ($signature.Status -ne 'NotSigned') {
                throw "Unexpected Authenticode status on $($file.Name): $($signature.Status)"
              }
              Write-Host "$($file.Name): no Authenticode publisher signature (declared unsigned release)"
              continue
            }
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Missing trusted timestamp on $($file.Name)"
            }
            Write-Host "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }
          foreach ($installer in $installers) {
            $sig = "$($installer.FullName).sig"
            if (-not (Test-Path $sig) -or (Get-Item $sig).Length -eq 0) {
              throw "Missing Tauri updater signature for $($installer.Name)"
            }
          }
      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $artifacts = Get-ChildItem src-tauri\target\release\bundle -Recurse -File | Where-Object {
            $_.Name -like "Dictum_$version*" -and $_.Extension -in @('.exe', '.msi')
          }
          if ($artifacts.Count -ne 2) { throw "Expected one NSIS and one MSI artifact, found $($artifacts.Count)" }
          $checksums = $artifacts | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $checksums
          gh release upload "v$version" SHA256SUMS.txt --clobber
