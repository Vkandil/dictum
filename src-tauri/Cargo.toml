[package]
name = "dictum"
version = "1.3.1"
default-run = "dictum"
description = "Open-source, local-first, system-wide voice dictation for Windows"
authors = ["Dictum contributors"]
license = "MIT"
repository = "https://github.com/Vkandil/dictum"
edition = "2021"
rust-version = "1.81"

[lib]
name = "dictum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dictum"
path = "src/main.rs"

[[bin]]
name = "dictum-cli"
path = "src/bin/dictum-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
arboard = "3.4"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
directories = "6"
enigo = "0.2"
futures-util = "0.3"
hound = "3.5"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
rdev = "0.5"
winreg = "0.55"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
